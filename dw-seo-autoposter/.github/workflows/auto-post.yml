name: Auto SEO Blog Post

on:
  schedule:
    # Wtorek, Czwartek, Sobota o 8:00 UTC (9:00 polskiego czasu)
    - cron: '0 7 * * 2'   # Wtorek
    - cron: '0 7 * * 4'   # Czwartek
    - cron: '0 7 * * 6'   # Sobota
  
  # Możliwość ręcznego uruchomienia z panelu GitHub
  workflow_dispatch:
    inputs:
      keyword_override:
        description: 'Opcjonalnie wpisz konkretne słowo kluczowe (zostaw puste = losowe)'
        required: false
        default: ''

jobs:
  publish-seo-post:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write  # potrzebne do zapisu used.json

    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Ustaw Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Zainstaluj zależności
        run: pip install requests

      - name: Generuj i publikuj wpis SEO
        env:
          WP_URL:          ${{ secrets.WP_URL }}
          WP_USER:         ${{ secrets.WP_USER }}
          WP_PASSWORD:     ${{ secrets.WP_PASSWORD }}
          CLAUDE_KEY:      ${{ secrets.CLAUDE_KEY }}
          WP_CATEGORY_ID:  ${{ secrets.WP_CATEGORY_ID }}
          POST_STATUS:     ${{ secrets.POST_STATUS }}
        run: python post.py

      - name: Zapisz historię użytych słów kluczowych
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add keywords/used.json || true
          git diff --staged --quiet || git commit -m "chore: aktualizuj historię słów kluczowych [skip ci]"
          git push || true
